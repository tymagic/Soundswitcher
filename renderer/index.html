<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sound Switcher</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="bg-gradient"></div>

  <!-- 标题栏 -->
  <div class="titlebar" id="titlebar">
    <div class="titlebar-drag">
      <svg class="titlebar-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M3 18v-6a9 9 0 0 1 18 0v6"></path>
        <path d="M21 19a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3zM3 19a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2H3z"></path>
      </svg>
      <span class="titlebar-text">Sound Switcher</span>
    </div>
    <div class="titlebar-actions">
      <button class="titlebar-btn" id="btn-minimize" title="最小化">
        <svg viewBox="0 0 12 12"><rect y="5" width="12" height="1.5" fill="currentColor"/></svg>
      </button>
      <button class="titlebar-btn titlebar-btn-close" id="btn-close" title="关闭">
        <svg viewBox="0 0 12 12"><path d="M1 1l10 10M11 1L1 11" stroke="currentColor" stroke-width="1.5"/></svg>
      </button>
    </div>
  </div>

  <!-- 主面板 -->
  <div class="main-panel">

    <!-- 快捷键卡片 -->
    <div class="glass-card hotkey-card">
      <div class="hotkey-display">
        <span class="hotkey-label">全局快捷键</span>
        <div class="hotkey-keys" id="hotkey-display">
          <kbd>Ctrl</kbd><span>+</span><kbd>Shift</kbd><span>+</span><kbd>F12</kbd>
        </div>
        <p class="hotkey-hint">快捷键循环切换设备组</p>
      </div>
    </div>

    <!-- ===== 设备组管理面板 ===== -->
    <div class="glass-card groups-section">
      <div class="section-header">
        <span>📋 设备组</span>
        <span class="group-counter" id="group-counter">0 组</span>
        <button class="icon-btn" id="btn-add-group" title="添加设备组">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        </button>
      </div>
      <div class="group-list" id="group-list">
        <div class="group-empty">暂无设备组，点击 + 创建</div>
      </div>
    </div>

    <!-- ===== 当前选中组的编辑面板（隐藏） ===== -->
    <div class="glass-card edit-panel" id="edit-panel" style="display:none;">
      <div class="section-header">
        <span id="edit-panel-title">添加设备组</span>
        <button class="icon-btn icon-btn-close-panel" id="btn-close-panel">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>

      <div class="edit-field">
        <label>组名称</label>
        <input type="text" id="edit-group-name" placeholder="例如：游戏模式" maxlength="30" class="glass-input">
      </div>

      <div class="edit-field">
        <label>🔊 输出设备 (耳机/音箱)</label>
        <div class="edit-device-list" id="edit-output-list"></div>
      </div>

      <div class="edit-field">
        <label>🎤 输入设备 (麦克风)</label>
        <div class="edit-device-list" id="edit-input-list"></div>
      </div>

      <div class="edit-actions">
        <button class="glass-btn glass-btn-cancel" id="btn-cancel-edit">取消</button>
        <button class="glass-btn glass-btn-primary" id="btn-save-group">保存组</button>
      </div>
    </div>

    <!-- ===== 所有设备列表（可折叠） ===== -->
    <div class="glass-card device-section">
      <div class="section-header collapsible" id="toggle-devices">
        <span>🔧 所有设备</span>
        <span class="collapse-icon" id="collapse-icon">▼</span>
      </div>
      <div class="collapsible-body" id="device-body">
        <div class="sub-section">
          <span class="sub-title">🔊 输出设备</span>
          <div class="device-list compact" id="output-devices">
            <div class="device-item placeholder">加载中...</div>
          </div>
        </div>
        <div class="sub-section">
          <span class="sub-title">🎤 输入设备</span>
          <div class="device-list compact" id="input-devices">
            <div class="device-item placeholder">加载中...</div>
          </div>
        </div>
      </div>
    </div>

    <!-- 操作按钮 -->
    <div class="actions">
      <button class="glass-btn glass-btn-primary" id="btn-switch">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="17 1 21 5 17 9"></polyline>
          <path d="M3 11V9a4 4 0 0 1 4-4h14"></path>
          <polyline points="7 23 3 19 7 15"></polyline>
          <path d="M21 13v2a4 4 0 0 1-4 4H3"></path>
        </svg>
        <span id="btn-switch-text">切换下一组</span>
      </button>
      <button class="glass-btn" id="btn-refresh">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="23 4 23 10 17 10"></polyline>
          <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
        </svg>
        <span>刷新</span>
      </button>
    </div>
    <div class="actions">
      <button class="glass-btn" id="btn-shortcut">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="3" width="18" height="18" rx="3"/>
          <line x1="8" y1="3" x2="8" y2="21"/>
        </svg>
        <span>创建桌面快捷方式</span>
      </button>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast"></div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
